name: Feature
description: Something Bearpaw should do and does not.
labels: ["feat"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Bearpaw makes hard or impossible?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like it to do
    validations:
      required: true
  - type: dropdown
    id: scanner
    attributes:
      label: Which scanner does this apply to
      options:
        - BC125AT family
        - BC75XLT
        - Both
        - Neither / not scanner-specific
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
      description: The workaround, if there is one. This is how the priority gets judged.
