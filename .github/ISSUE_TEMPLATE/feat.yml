name: Feature
description: Something Bearpaw should do and does not.
labels: ["feat"]
body:
  - type: textarea
    id: user_story
    attributes:
      label: User story
      description: |
        Lead with the situation, not a role. Bearpaw has one kind of user, so
        "as a user" is always true and tells us nothing — when you hit this is
        what carries the information.
      value: "When I'm "
      placeholder: |
        When I'm entering a long list of frequencies from a spreadsheet, I want to
        paste them in one go, so that I'm not making six clicks per channel.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Bearpaw makes hard or impossible?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like it to do
    validations:
      required: true
  - type: dropdown
    id: scanner
    attributes:
      label: Which scanner does this apply to
      options:
        - BC125AT family
        - BC75XLT
        - Both
        - Neither / not scanner-specific
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
      description: The workaround, if there is one. This is how the priority gets judged.
