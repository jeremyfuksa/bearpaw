name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Code review has nothing to say about a PDF or a changelog entry. Prose
    # changes get human review; this workflow is for code.
    paths:
      - "crates/**"
      - "frontend/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/claude-code-review.yml"

jobs:
  claude-review:
    # Skip on Dependabot PRs. GitHub withholds repository secrets (including
    # CLAUDE_CODE_OAUTH_TOKEN) from Dependabot-authored PRs, so the review step
    # can't authenticate and the job would always fail. A skipped job reports as
    # neutral/success, so this keeps Dependabot PRs green without reviewing them.
    #
    # The same is true of PRs from FORKS, for the same reason: GitHub withholds
    # secrets from `pull_request` runs whose head is another repository. Without
    # this second clause every outside contributor gets a guaranteed red check
    # and a review that silently never ran -- which reads as "your PR is bad"
    # rather than "this check cannot run here". Observed on #467 (dan-r/bearpaw),
    # where claude-review failed in 28s while every real check passed.
    #
    # Skipping is the honest report. Reviewing a fork PR safely needs
    # `pull_request_target`, which runs the BASE repo's workflow with secrets
    # against the fork's code -- a much larger security decision than this.
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

