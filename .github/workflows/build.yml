name: Build Bearpaw

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Release Preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Test release preflight
        run: python3 -m unittest discover -s scripts -p 'test_release_preflight.py'
      - name: Validate release metadata
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            python3 scripts/release_preflight.py --tag "${GITHUB_REF_NAME}"
          else
            python3 scripts/release_preflight.py
          fi
      - name: Test release status
        run: python3 -m unittest discover -s scripts -p 'test_release_status.py'
      - name: Test docs readability
        run: python3 -m unittest discover -s scripts -p 'test_docs_readability.py'
      - name: Check docs readability
        run: python3 scripts/docs_readability.py --check

      # A release is defined by its milestone. Tagging while that milestone
      # still has open work is what produced 1.1.0: PR #616 set every version
      # file on 2 September and nineteen commits landed afterwards, five of
      # them user-visible fixes nobody wrote up. The version files agreed with
      # each other the whole time, so no existing check could see it.
      - name: Check the release milestone is clear
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          open=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/milestones?state=all" \
            --jq "[.[] | select(.title == \"${tag}\")] | first | .open_issues" 2>/dev/null || true)
          if [ -z "${open}" ] || [ "${open}" = "null" ]; then
            echo "::error::No milestone named ${tag}. A release is defined by its" \
                 "milestone: create it, file this release's work into it, and close" \
                 "that work before tagging."
            exit 1
          fi
          if [ "${open}" != "0" ]; then
            echo "::error::Milestone ${tag} has ${open} open item(s). A release" \
                 "cannot be tagged while its milestone has open work. Close them," \
                 "or move them to a later milestone if they are genuinely deferred."
            exit 1
          fi
          echo "milestone ${tag} is clear"

  quality:
    name: Quality Gates
    uses: ./.github/workflows/tests.yml

  build:
    name: Build on ${{ matrix.platform }}
    needs: [preflight, quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: darwin-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64

    runs-on: ${{ matrix.os }}

    # NOTE: Apple/Windows code-signing identities are deliberately NOT exported
    # at the job level. Tauri's bundler runs `codesign` during `tauri build`
    # whenever APPLE_SIGNING_IDENTITY is *present* in the env — even as an empty
    # string from an unset secret — and then fails with no usable identity.
    # These builds ship UNSIGNED (see the create-release notes), so the signing
    # vars live only on the explicit Sign steps below, which self-skip when the
    # secret is absent. Add the secrets and those steps light up automatically.
    env:
      TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
      TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libudev-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Rust
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Tauri app
        working-directory: frontend
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Sign macOS app
        if: matrix.os == 'macos-latest' && env.APPLE_SIGNING_IDENTITY != ''
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          xcrun codesign --force --deep --sign "$APPLE_SIGNING_IDENTITY" \
            target/${{ matrix.target }}/release/bundle/macos/Bearpaw.app

      - name: Sign Windows installer
        if: matrix.os == 'windows-latest' && env.WIN_CERTIFICATE_THUMBPRINT != ''
        shell: pwsh
        env:
          WIN_CERTIFICATE_THUMBPRINT: ${{ secrets.WIN_CERTIFICATE_THUMBPRINT }}
          WIN_CERTIFICATE_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
        run: |
          $msi = Get-ChildItem -Path "target/${{ matrix.target }}/release/bundle/msi" -Filter *.msi | Select-Object -First 1
          if ($msi) {
            signtool sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 /sha1 $env:WIN_CERTIFICATE_THUMBPRINT $msi.FullName
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bearpaw-${{ matrix.platform }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          retention-days: 30
          if-no-files-found: ignore

  create-release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      # Pre-release tags (v*-beta.*, v*-rc.*, v*-alpha.*) publish as GitHub
      # pre-releases so testers see them flagged and they don't displace a
      # stable "latest". A bare vX.Y.Z tag publishes as a normal release.
      - name: Flag pre-release tags
        id: prerelease
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      # Pull this version's CHANGELOG section into the release body. The
      # auto-generated "What's Changed" list is a flat dump of every merged PR
      # — mostly dependency bumps — so a visitor deciding whether to download
      # has to hunt for the parts that affect them. The CHANGELOG says the same
      # thing in prose, ordered by what a user cares about. Both are kept:
      # generate_release_notes still appends New Contributors and the compare
      # link below the prose.
      #
      # Preflight already verifies the section. Keep this stable-release check
      # here too so a future workflow edit cannot silently publish empty notes.
      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            if [[ "$VERSION" == *-* ]]; then
              echo "::warning::No CHANGELOG section found for pre-release $VERSION"
            else
              echo "::error::No CHANGELOG section found for stable release $VERSION"
              exit 1
            fi
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          # Only real installers. A recursive glob also matches the loose
          # files inside an unpacked .app (Info.plist, CodeResources,
          # Bearpaw.icns, bearpaw-desktop), and both macOS architectures
          # produce identically-named copies — uploading the same asset name
          # twice raced and failed the v1.0.0 release with a 404.
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*.exe
            release-artifacts/**/*.deb
            release-artifacts/**/*.AppImage
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.prerelease.outputs.value }}
          # These builds are ad-hoc signed but not notarized — prepend per-OS
          # instructions for getting past Gatekeeper/SmartScreen above the
          # auto-generated changelog.
          body: |
            ${{ steps.changelog.outputs.notes }}

            ---

            ## Installing this build

            Bearpaw is a control interface for supported Uniden analog handheld
            scanners, including the BC125AT family and BC75XLT. These builds are
            ad-hoc signed but **not notarized by Apple**, so your OS will warn
            you the first time you open the app. That's expected — here's how
            to run it:

            **macOS** (`.dmg`): open the dmg and drag Bearpaw to Applications. On
            first launch macOS says it "cannot verify the developer" — right-click
            the app → **Open** → **Open** to run it anyway. If a plain
            double-click was your first attempt, open System Settings → Privacy &
            Security and click **Open Anyway**.

            **Windows** (`.exe`): if SmartScreen shows "Windows
            protected your PC", click **More info** → **Run anyway**.

            **Linux** (`.AppImage`): `chmod +x` it and run; or install the `.deb`.

            Plug in a supported scanner over USB and launch — the app
            auto-detects its family, so no config file is required to get
            started. (A `config.yaml` beside the app is only needed to override
            the port or tweak advanced settings.)

            Found a bug? Please open an issue with your OS and what you were doing.

            ---
