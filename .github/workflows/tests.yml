name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # NO `paths:` filter, deliberately. This workflow's five jobs are REQUIRED
    # status checks on `main`, and a required check that never runs never
    # reports — so a filtered-out PR is not "fast", it is permanently
    # unmergeable.
    #
    # There used to be an allowlist here (crates/**, frontend/**, Cargo.*,
    # this file) on the reasoning that a docs-only PR has no Rust to compile
    # and no TypeScript to lint, so the ~9 minutes buys nothing. That was
    # correct while its stated premise held — the old comment said so plainly:
    # "`main` has no branch protection, so a PR reporting zero checks is still
    # mergeable." Branch protection was added 2026-08-29 and silently
    # invalidated it. Every docs-only, site-only and workflow-bump PR would
    # have been blocked, Dependabot's included.
    #
    # So: spend the CI minutes (free on a public repo) rather than reintroduce
    # the filter. If it ever comes back, it MUST come back together with a
    # companion workflow reporting these five job names for the excluded
    # paths — and that companion is a landmine, because renaming a job here
    # without renaming it there blocks every PR with no visible cause.
  workflow_call:

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Test release preflight
        run: python3 -m unittest discover -s scripts -p 'test_release_preflight.py'
      - name: Validate release metadata consistency
        run: python3 scripts/release_preflight.py
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # rustfmt ships with the stable toolchain by default; naming it makes
          # the dependency of the format check below visible rather than
          # incidental.
          components: rustfmt
      # Runs before the cache restore and the build because it needs neither:
      # `cargo fmt --check` only parses and prints, so a formatting failure
      # reports in seconds instead of after a multi-minute compile.
      #
      # `--all` rather than `-p bearpaw-api` deliberately: the drift this guard
      # was added for (#394) included two files in frontend/src-tauri, and
      # `--all` is also what a developer runs locally.
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Cache Rust
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      # apt's package lists and the .debs they name are cached together, so a
      # warm run installs with no network at all. The Ubuntu mirror's stalls
      # ran this job into its timeout before any test ran (#858). The lists
      # must be cached too: the runner image's own lists go stale within
      # days, so a .deb cache built from fresh lists never matches them, and
      # one built from the image's lists can't be built at all once the
      # mirror drops the versions they name (both seen on #860).
      #
      # Keyed on the runner image, so a new image rebuilds the cache against
      # its own installed packages, and on the package list.
      #
      # Not awalsh128/cache-apt-pkgs-action: on a miss it pipes an install
      # script from another repo's master branch into bash under sudo, which a
      # pinned SHA does not pin, and this job also runs in the release
      # pipeline (build.yml).
      - name: Compute apt cache key
        id: apt-key
        run: |
          echo "pkgs=$APT_PKGS" >> "$GITHUB_OUTPUT"
          echo "key=apt-v3-$ImageOS-$ImageVersion-$(echo "$APT_PKGS" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
        env:
          APT_PKGS: libudev-dev pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Cache apt packages
        uses: actions/cache@v6
        with:
          path: ~/apt-cache
          key: ${{ steps.apt-key.outputs.key }}
      - name: Install Linux system deps (USB + Tauri)
        run: |
          mkdir -p ~/apt-cache/archives/partial ~/apt-cache/lists/partial
          # Retries plus a connection timeout turn a stalled mirror into a
          # retry, not a 10-minute hang.
          opts="-o Dir::Cache::Archives=$HOME/apt-cache/archives -o Dir::State::Lists=$HOME/apt-cache/lists -o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          if sudo apt-get install -y --no-download $opts $PKGS; then
            echo "apt: installed from cache"
          else
            echo "apt: cache miss; updating"
            sudo apt-get update $opts
            sudo apt-get install -y $opts $PKGS
          fi
          # apt writes as root; let the cache step read and save it.
          sudo chown -R "$USER" ~/apt-cache
        env:
          PKGS: ${{ steps.apt-key.outputs.pkgs }}
      - name: Run backend tests
        run: cargo test -p bearpaw-api --lib
      # Tauri's `generate_context!` macro validates that the configured
      # `frontendDist` path (`../dist`) exists at compile time even for
      # `cargo check`. Build the frontend first so the workspace check
      # has something to point at.
      - name: Setup Node.js (for Tauri frontendDist)
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend dist
        run: |
          cd frontend
          npm ci
          npm run build
      # Cheap insurance against silent drift in the Tauri crate (see
      # https://github.com/jeremyfuksa/bearpaw/pull/80). Workspace check
      # catches signature mismatches like the Phase 9b run_server_with_shutdown
      # tuple change that would otherwise only surface on `npm run tauri:dev`.
      - name: Check whole workspace compiles
        run: cargo check --workspace --all-targets

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: |
          cd frontend
          npm ci
      - name: Run frontend tests
        run: |
          cd frontend
          npm test

  lint-frontend:
    name: Frontend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: |
          cd frontend
          npm ci
      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

  type-check-frontend:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: |
          cd frontend
          npm ci
      - name: Run tsc
        run: |
          cd frontend
          npm run type-check

  format-check-frontend:
    name: Frontend Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: |
          cd frontend
          npm ci
      - name: Run Prettier
        run: |
          cd frontend
          npm run format:check
