[package]
name = "bearpaw-desktop"
version = "1.2.0"
description = "Bearpaw Desktop"
authors = ["Jeremy Fuksa"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bearpaw-api = { path = "../../crates/bearpaw-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-fs = "2.7.1"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
# Update check only (Help → Check for Updates). Blocking client with a
# rustls backend: one GET per launch doesn't justify pulling an async
# HTTP stack, and the app links no TLS otherwise (axum's hyper is
# server-side only).
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
